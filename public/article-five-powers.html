<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>五種心靈力量｜朝向自由</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="logo" href="index.html">GINA</a><a href="javascript:history.back()">← 上一步</a></div></header><main><section class="hero"><div class="wrap"><a class="back" href="javascript:history.back()">← 上一步</a><div class="tag">SELF · FIVE POWERS</div><h1>五種心靈力量</h1><p>讓自己在生活裡，更穩定、更清醒，也更有選擇。</p><div class="intro"><p>1. 信仰（正信）：信任生命，跟著浪走。</p><p>2. 精進（正勤）：持續努力，不是急躁，而是穩定累積。</p><p>3. 正念：活在當下，接受每個狀態的自己。</p><p>4. 專注（正定）：專心做好正在做的事情。</p><p>5. 內觀（智慧）：觀察自己內心，從中生出洞見。</p></div></div></section></main><footer><div class="wrap">GINA · 朝向自由的方向前進</div></footer></body></html>
