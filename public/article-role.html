<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在團體互動時給自己一個定位｜朝向自由</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="logo" href="index.html">GINA</a><a href="javascript:history.back()">← 上一步</a></div></header><main><section class="hero"><div class="wrap"><a class="back" href="javascript:history.back()">← 上一步</a><div class="tag">RELATIONSHIPS · GROUP</div><h1>在團體互動時給自己一個定位</h1><p>不一定要成為最會說話的人，找到自己的參與方式就好。</p><div class="intro"><p>我可以是觀察者：觀察每個人的喜好，觀察每個人生活的樣子。</p><p>我可以是分享者。</p><p>也可以是聆聽＋研究者。</p><p>重要的是找到自己舒服、真實的參與方式。</p></div></div></section></main><footer><div class="wrap">GINA · 朝向自由的方向前進</div></footer></body></html>
