<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>不是做得很完美，而是我從過程學到了什麼｜朝向自由</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="logo" href="index.html">GINA</a><a href="javascript:history.back()">← 上一步</a></div></header><main><section class="hero"><div class="wrap"><a class="back" href="javascript:history.back()">← 上一步</a><div class="tag">LEARNING · GROUP</div><h1>不是做得很完美，而是我從過程學到了什麼</h1><p>團體活動真正留下來的，可能是一起完成事情的過程。</p><div class="intro"><p>感受每個團體活動的意義，不是做得很完美，而是那個做的過程：我學到了什麼？</p><p>也欣賞對報告非常認真的人，也欣賞自己可以有邏輯地思考問題。</p><p>面對團體活動，我可以選擇與他溝通、好好參與，也可以找到適合自己的參與方式。</p><p>專心享受活動本身，不要一直只看自己做得好不好。</p></div></div></section></main><footer><div class="wrap">GINA · 朝向自由的方向前進</div></footer></body></html>
