<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>🫙 支出｜未來許願池｜朝向自由</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="logo" href="index.html">GINA</a><a href="javascript:history.back()">← 上一步</a></div></header><main><section class="hero"><div class="wrap"><a class="back" href="javascript:history.back()">← 上一步</a><div class="tag">DIRECTION · MONEY</div><h1>🫙 支出｜未來許願池</h1><p>先看清楚自己的金錢流向，再決定未來想把錢放在哪裡。</p><div class="intro"><p>財富自由數字。</p><p>檢視目前消費行為：在生活的哪個區塊花最多錢、最捨得花錢？哪些區塊不值得花錢？</p><p>六罐子理財法：每個月將所有收入依照比例分成 6 個帳戶：財務自由 10%、教育 10%、長期儲蓄 10%、玩樂 10%、生活必須 55%、捐贈 5%。</p><p>每個帳戶的錢都只能用在該用途，不能透支，也不能挪用。</p></div></div></section></main><footer><div class="wrap">GINA · 朝向自由的方向前進</div></footer></body></html>
