<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>不回答，也是一個答案｜朝向自由</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="logo" href="index.html">GINA</a><a href="javascript:history.back()">← 上一步</a></div></header><main><section class="hero"><div class="wrap"><a class="back" href="javascript:history.back()">← 上一步</a><div class="tag">RELATIONSHIPS · BOUNDARIES</div><h1>不回答，也是一個答案</h1><p>不是每個問題都需要回答；界線也是一種選擇。</p><div class="intro"><p>檢視念頭後面的意圖。</p><p>不喜歡被問問題，可能是下意識覺得每個問題都要被回答。</p><p>解決：建立界線。</p><p>本來就不是每個問題都應該要回答。</p><p>不回答也是一個答案。</p><p>別人的情緒，給他一點時間消化。</p><p>先安住自己，我不需要證明「我是對的」。</p><p>課題分離。我的責任是：清楚自己真實的心意。</p><p>我不需要靠別人理解，才能確認自己的價值。</p><p>錯失恐懼：我願意再練習更自在。</p></div></div></section></main><footer><div class="wrap">GINA · 朝向自由的方向前進</div></footer></body></html>
