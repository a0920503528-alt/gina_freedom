<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>我有這樣的想法，但是這個想法不是我｜朝向自由</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="logo" href="index.html">GINA</a><a href="javascript:history.back()">← 上一步</a></div></header><main><section class="hero"><div class="wrap"><a class="back" href="javascript:history.back()">← 上一步</a><div class="tag">SELF · INNER WORLD</div><h1>我有這樣的想法，但是這個想法不是我</h1><p>先辨認，再選擇；先保護自己。</p><div class="intro"><p>能量學習最重要：先保護自己。</p><p>1. 辨認。 2. 選擇。</p><p>讓自己敞開，體驗不一樣的生活經驗、人際交流，體驗生命更多可能性。</p><p>頻率狀態：把自己當下的狀態看見，而不是直接把它等同於「我」。</p></div></div></section></main><footer><div class="wrap">GINA · 朝向自由的方向前進</div></footer></body></html>
