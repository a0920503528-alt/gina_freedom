<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>我不屬於一個片刻而已｜朝向自由</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="logo" href="index.html">GINA</a><a href="javascript:history.back()">← 上一步</a></div></header><main><section class="hero"><div class="wrap"><a class="back" href="javascript:history.back()">← 上一步</a><div class="tag">SELF · SELF-WORTH</div><h1>我不屬於一個片刻而已</h1><p>別人的評價與世界的標準，都只是片刻的標準。</p><div class="intro"><p>所有對他人的評價、對世界標準的評價，終究是片刻的標準。</p><p>我不屬於一個片刻而已。</p><p>你的人生可以不用符合平均標準，只有當你更重視、理解自己的時候，成就自己的存在。</p></div></div></section></main><footer><div class="wrap">GINA · 朝向自由的方向前進</div></footer></body></html>
