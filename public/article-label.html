<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>不要急著替別人貼標籤｜朝向自由</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="logo" href="index.html">GINA</a><a href="index.html">← HOME</a></div></header><main><section class="hero"><div class="wrap"><a class="back" href="javascript:history.back()">← 上一步</a><div class="tag">RELATIONSHIPS · ARTICLE</div><h1>不要急著替別人貼標籤</h1><div class="intro"><p>在團體活動的時候，我開始練習不要一直替別人下定義，而是專心聽、專心了解這個人。</p><p>我可能對動漫沒有興趣，但我可以好奇：「他為什麼會喜歡？」</p><p>有時候真正值得探索的不是「這個人怎麼這樣」，而是：</p><h2>「為什麼他的這個行為會讓我不舒服？」</h2><p>當我不再一直評價別人，自己也會更輕鬆。</p></div></div></section></main><footer><div class="wrap">GINA · 朝向自由的方向前進</div></footer></body></html>
