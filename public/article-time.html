<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>時間，會帶我們走過很多事情｜朝向自由</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="logo" href="index.html">GINA</a><a href="javascript:history.back()">← 上一步</a></div></header><main><section class="hero"><div class="wrap"><a class="back" href="javascript:history.back()">← 上一步</a><div class="tag">LIFE · EXPERIENCE</div><h1>時間，會帶我們走過很多事情</h1><p>有些傷會淡去，但經歷過的事情，會成為我們繼續往前走的力量。</p><div class="intro"><p>時間，一轉眼就過了。</p><p>傷痛，會隨著時間的流逝淡化，剩下淡淡的感傷。</p><p>但是曾經有的記憶，都會化做回憶和經驗陪伴著我們，走過接下來的每個旅途，帶給我們力量和提醒。</p><p>因此，不要害怕受傷，勇敢的去體驗，讓生命沒有遺憾！</p></div></div></section></main><footer><div class="wrap">GINA · 朝向自由的方向前進</div></footer></body></html>
