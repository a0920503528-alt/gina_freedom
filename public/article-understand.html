<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用自己的方式了解別人｜朝向自由</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="logo" href="index.html">GINA</a><a href="javascript:history.back()">← 上一步</a></div></header><main><section class="hero"><div class="wrap"><a class="back" href="javascript:history.back()">← 上一步</a><div class="tag">RELATIONSHIPS · UNDERSTANDING</div><h1>用自己的方式了解別人</h1><p>不需要喜歡同樣的東西，也可以對一個人的世界保持好奇。</p><div class="intro"><p>我可能對動漫沒有興趣，但可以去好奇別人為什麼會喜歡？</p><p>不是一定要和對方一樣，而是用自己的方式理解一個和自己不同的人。</p><p>觀察自己：對別人的標籤有哪些？我不舒服的點是什麼？再用這個去找答案。</p></div></div></section></main><footer><div class="wrap">GINA · 朝向自由的方向前進</div></footer></body></html>
