<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 生活探索｜朝向自由</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="logo" href="index.html">GINA</a><a href="index.html">← HOME</a></div></header><main><section class="hero"><div class="wrap"><a class="back" href="javascript:history.back()">← 上一步</a><div class="tag">AI LIFE EXPLORER</div><h1>我現在有一個問題。</h1><p class="mini-note">這裡不是諮商或診斷；比較像一個陪你整理想法的對話空間。</p><p>不用想好怎麼問。把你現在腦中的事情直接說出來，我們從這裡開始。</p><div class="chatbox"><div class="chathead"><span class="dot"></span><b>生活探索助手</b></div><div class="chatlog" id="log"><div class="bubble bot">嗨，我在這裡。最近有什麼事情讓你卡住、煩惱，或一直想不明白？</div><div class="bubble bot">你可以直接講一段話，不需要整理得很完整。</div></div><form class="chatform" id="f"><input id="q" autocomplete="off" placeholder="輸入你想說的事情……" required><button>送出</button></form></div></div></section></main><footer><div class="wrap">GINA · 朝向自由的方向前進</div></footer><script>const f=document.querySelector('#f'),q=document.querySelector('#q'),l=document.querySelector('#log');f.onsubmit=e=>{e.preventDefault();let t=q.value.trim();if(!t)return;let u=document.createElement('div');u.className='bubble user';u.textContent=t;l.appendChild(u);q.value='';setTimeout(()=>{let b=document.createElement('div');b.className='bubble bot';b.textContent='我先不急著給你答案。可以試著一起看看：這件事讓你最在意的是什麼？你真正希望改變的是事情本身，還是你面對它的方式？';l.appendChild(b);l.scrollTop=l.scrollHeight},250);l.scrollTop=l.scrollHeight}</script></body></html>
