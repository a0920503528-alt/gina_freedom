<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>我開始擁有更多選擇權｜朝向自由</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="logo" href="index.html">GINA</a><a href="javascript:history.back()">← 上一步</a></div></header><main><section class="hero"><div class="wrap"><a class="back" href="javascript:history.back()">← 上一步</a><div class="tag">LIFE · CHOICE</div><h1>我開始擁有更多選擇權</h1><p>學習了一年療癒，我覺得自己多了更多「選擇權」。</p><div class="intro"><p>選擇自己想要的生活方式、選擇自己的想法、尊重別人的侷限、選擇自己想要接近的人，也過得更舒服自由。</p><p>不是變成一個永遠不受傷的人，而是多了選擇的能力。</p></div></div></section></main><footer><div class="wrap">GINA · 朝向自由的方向前進</div></footer></body></html>
