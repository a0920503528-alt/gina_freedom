<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>從不舒服裡，打造更舒服的生活｜朝向自由</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="logo" href="index.html">GINA</a><a href="javascript:history.back()">← 上一步</a></div></header><main><section class="hero"><div class="wrap"><a class="back" href="javascript:history.back()">← 上一步</a><div class="tag">LIFE · FREEDOM</div><h1>從不舒服裡，打造更舒服的生活</h1><p>世界不會為我們任何一個人改變，但是我們可以量身打造屬於自己的世界的樣貌。</p><div class="intro"><p>有些事情我們無法改變。世界有它的樣子，別人也有他們的選擇。</p><p>但我們可以慢慢去認識自己：什麼讓我不舒服？什麼是我真正想要的？</p><p>然後從那些不舒服裡，一點一點調整自己的生活。</p><p>不一定要改變整個世界。先打造一個更適合自己的世界。</p></div></div></section></main><footer><div class="wrap">GINA · 朝向自由的方向前進</div></footer></body></html>
