<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寬以待人，也寬以待己｜朝向自由</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="logo" href="index.html">GINA</a><a href="javascript:history.back()">← 上一步</a></div></header><main><section class="hero"><div class="wrap"><a class="back" href="javascript:history.back()">← 上一步</a><div class="tag">RELATIONSHIPS · KINDNESS</div><h1>寬以待人，也寬以待己</h1><p>少一點標籤，多一點理解，自己也會更輕鬆。</p><div class="intro"><p>在團體活動的時候，不要一直幫別人貼標籤，而是專心地聽，專心地了解這個人。</p><p>不再一直幫別人貼標籤，自己也會更輕鬆。</p><p>也可以欣賞對報告非常認真的人，同時欣賞自己可以有邏輯地思考問題。</p></div></div></section></main><footer><div class="wrap">GINA · 朝向自由的方向前進</div></footer></body></html>
