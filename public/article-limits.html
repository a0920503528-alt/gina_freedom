<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>理解別人的侷限｜朝向自由</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="logo" href="index.html">GINA</a><a href="javascript:history.back()">← 上一步</a></div></header><main><section class="hero"><div class="wrap"><a class="back" href="javascript:history.back()">← 上一步</a><div class="tag">RELATIONSHIPS · LIMITS</div><h1>理解別人的侷限</h1><p>別人可能不擅長細膩觀察、不擅長提問，關心他人的方式也可能就是這樣。</p><div class="intro"><p>別人不擅長我想要被理解的樣子，不代表他不在乎我。</p><p>每個人的經歷都不一樣，也可能限制了他看事情的方式。</p><p>我可以尊重別人的侷限，也可以有機會去花錢學習，找到自己想要的理解與支持。</p></div></div></section></main><footer><div class="wrap">GINA · 朝向自由的方向前進</div></footer></body></html>
