<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>資源分配：時間、精力、金錢｜朝向自由</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="logo" href="index.html">GINA</a><a href="javascript:history.back()">← 上一步</a></div></header><main><section class="hero"><div class="wrap"><a class="back" href="javascript:history.back()">← 上一步</a><div class="tag">DIRECTION · RESOURCES</div><h1>資源分配：時間、精力、金錢</h1><p>人生有限的資源，不只有金錢，還有時間與精力。</p><div class="intro"><p>時間：我想把時間花在哪些事情上？</p><p>精力：什麼事情值得我投入有限的能量？</p><p>金錢：什麼支出真的能讓我的生活更接近想要的樣子？</p><p>打造自己的生活，本質上就是慢慢決定：我的時間、精力、金錢，要留給什麼？</p></div></div></section></main><footer><div class="wrap">GINA · 朝向自由的方向前進</div></footer></body></html>
